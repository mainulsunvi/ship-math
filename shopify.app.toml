# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b86467e609d77f4530dc6649785b6cea"
name = "ShipMath: Smart Shipping Rules"
application_url = "https://example.com"
embedded = true
handle = "ship-math"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/shop-update"
  topics = [ "shop/update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read/write_delivery_customizations: create the function owner + set its config metafield (architecture.md §A1)
# read/write_shipping: carrier service registration + callback (spec 007, architecture.md §A3) — added in ONE batch per plan 000
# read_customers + read_locations: simulator pickers (spec 008) — same one-batch rule
scopes = "read_products, read_customers, read_locations, read_delivery_customizations, write_delivery_customizations, read_shipping, write_shipping"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]
